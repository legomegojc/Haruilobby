<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Felice Haruiro Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="overlay" class="overlay">
    <div class="value team-name alpha-name">
      <span id="ovAlphaName" class="team-name-text"></span>
    </div>

    <div class="value team-name beta-name">
      <span id="ovBetaName" class="team-name-text"></span>
    </div>
    <div id="ovBetaName" class="value team-name beta-name"></div>
    <div id="ovBetaScore" class="value score beta-score">0</div>
    <div id="ovRound" class="value round">1</div>
    <div id="ovGame" class="value game">1</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
